name: aurum
description: "Aurum · 液态玻璃音乐播放器（Flutter 移植版）"
publish_to: "none"
version: 0.5.0+6

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  # 音频引擎：支持 HTTP 流播放 + 实时 FFT/波形取数（等价 Web Audio AnalyserNode）。
  # 用 any 让解析器取最新稳定版，装好后可在 pubspec.lock 中查得确切版本。
  flutter_soloud: any
  # 本地音乐：文件夹选择（桌面端）
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    # 字体随包分发时必须带上许可证（SIL OFL 1.1）
    - assets/EBGaramond-OFL.txt
  fonts:
    - family: SmileySans
      fonts:
        - asset: assets/SmileySans-Oblique.ttf
    # 衬线：歌词段封面中央那个音高字母（EB Garamond，SIL OFL 1.1）。
    - family: AurumSerif
      fonts:
        - asset: assets/EBGaramond-Regular.ttf
          weight: 400
        - asset: assets/EBGaramond-SemiBold.ttf
          weight: 600
    # 像素字：乐器段平铺在背景上的音高字（HYPixel 11px）。
    # 与中央的衬线字母刻意用两套字体 —— 背景是街机/机器的质感，
    # 中央是乐谱的质感，一眼就能分清两个状态。
    - family: AurumPixel
      fonts:
        - asset: assets/HYPixel11pxU-2.ttf
